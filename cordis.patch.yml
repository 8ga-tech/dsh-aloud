# dsh-aloud 的加载行。
#
# 这一行把插件插进 profile 的 loader；`config:` 整块可以省略（全部有默认值）。
# 想改配置就取消注释并改值——`patchReload: live` 的 profile 里改完即时生效。
- insert:
    - id: aloud
      name: 'dsh-aloud'
